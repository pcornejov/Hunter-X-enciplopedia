name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; no cancelamos el que ya esta en marcha.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Construir y validar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar los datos generados
        run: npm run validate:data

      - name: Comprobar tipos
        run: npm run check

      - name: Construir el sitio
        run: npm run build

      - name: Validar el sitio construido
        run: npm run validate:build

      - name: Instalar Chromium para la prueba de humo
        run: npx playwright install --with-deps chromium

      # Levanta dist/ y lo recorre con un navegador real: rutas, buscador,
      # filtros, tema, spoilers y ausencia de desbordamientos en movil.
      - name: Prueba de humo en navegador
        run: |
          npx astro preview --port 4321 &
          PREVIEW_PID=$!
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:4321/Hunter-X-enciplopedia/; then break; fi
            sleep 1
          done
          npm run smoke
          STATUS=$?
          kill $PREVIEW_PID 2>/dev/null || true
          exit $STATUS

      # enablement: true intenta activar Pages desde el propio workflow. Solo
      # funciona si GITHUB_TOKEN tiene permisos de administracion sobre el
      # repositorio; si no, hay que activarlo a mano una unica vez.
      - name: Configurar GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explicar como activar Pages
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages no esta activado::El sitio se construyo y valido correctamente, pero no se pudo publicar."
          echo ""
          echo "El token del workflow no tiene permiso para crear el sitio de Pages."
          echo "Actívalo una sola vez desde la interfaz web:"
          echo ""
          echo "  Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
          echo ""
          echo "Después vuelve a lanzar este workflow (Actions -> Desplegar en GitHub Pages -> Re-run all jobs)."
          exit 1

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Respaldo: si el despliegue via GitHub Actions no esta disponible (el
  # entorno github-pages rechaza el deploy cuando el origen del repositorio
  # es "Deploy from a branch"), publicamos el mismo dist/ en la rama
  # gh-pages, que solo necesita permiso de escritura sobre el contenido.
  # Asi el sitio queda en linea con cualquiera de las dos configuraciones.
  respaldo-rama:
    name: Publicar en la rama gh-pages
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.deploy.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        run: npm run build

      - name: Publicar dist/ en gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rama huerfana: gh-pages solo contiene el sitio, sin historia de codigo.
          git checkout --orphan gh-pages-tmp
          git rm -rf --cached . >/dev/null
          find . -maxdepth 1 ! -name . ! -name .git ! -name dist -exec rm -rf {} +
          mv dist/* dist/.nojekyll . 2>/dev/null || mv dist/* .
          rmdir dist 2>/dev/null || true
          touch .nojekyll
          git add -A
          git commit -q -m "Publicar sitio (${GITHUB_SHA::7})"
          git push -f origin gh-pages-tmp:gh-pages

      - name: Recordar el ajuste pendiente
        run: |
          echo "::warning title=Publicado por la rama gh-pages::El despliegue via GitHub Actions no esta disponible."
          echo "El sitio se ha publicado en la rama gh-pages como respaldo."
          echo ""
          echo "Para usar la via recomendada, pon Settings -> Pages -> Source en 'GitHub Actions'."
          echo "Si prefieres seguir con la rama, ponlo en 'Deploy from a branch' -> gh-pages / (root)."
